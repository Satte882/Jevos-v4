name: Python unit tests
on:
  push:
  pull_request:
jobs:
  unittest:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Python modules
        run: python -m compileall -q inbox_assistant jevos_local redaction_app
      - name: Validate Obsidian plugin JavaScript
        run: node --check obsidian-plugin/main.js
      - name: Validate redaction view JavaScript
        run: node tests/test_redaction_ui.cjs
      - name: Validate technology labels and info buttons
        run: node tests/test_tech_info.cjs
      - name: Check compact UI layout and cloud consent behavior
        run: node tests/test_compact_ui.cjs
      - name: Test Obsidian one-click launcher
        run: node tests/test_launcher.cjs
      - name: Test direct Obsidian note actions
        run: node tests/test_note_actions.cjs
      - name: Run synthetic Obsidian bridge preflight
        run: node tests/test_plugin.cjs
      - name: Run unittest (no model download)
        run: python -m unittest discover -s tests -v
      - name: Validate PowerShell syntax (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Get-ChildItem scripts/*.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw "PowerShell syntax error in $($_.Name): $errors" }
          }
      - name: Test Windows launcher routing and keyless startup
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/test_launcher.ps1
