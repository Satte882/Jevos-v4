name: Python unit tests
on:
  push:
  pull_request:
jobs:
  unittest:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unittest (no model download)
        run: python -m unittest discover -s tests -v
